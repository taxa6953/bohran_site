<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Black Spaghetti</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    .apple-player {
      backdrop-filter: blur(10px);
      background: rgba(255, 255, 255, 0.1);
    }
    .star-rating input {
      display: none;
    }
    .star-rating label {
      font-size: 1.5rem;
      color: #555;
      cursor: pointer;
    }
    .star-rating input:checked ~ label,
    .star-rating label:hover,
    .star-rating label:hover ~ label {
      color: gold;
    }
  </style>
</head>
<body class="bg-gray-900 text-white p-4 min-h-screen">
  <div class="max-w-md mx-auto">
    <!-- Back Button -->
    <div class="mb-4">
      <a href="../index.html" class="text-white text-2xl">←</a>
    </div>

    <!-- Card -->
    <div class="bg-gray-800 rounded-3xl shadow-xl overflow-hidden">
      <img src="image1.jpg" alt="Main" class="w-full object-cover h-64">

      <div class="p-4">
        <!-- Title and Rating -->
        <div class="flex justify-between items-center mb-2">
          <h1 class="text-2xl font-bold">Black Spaghetti</h1>
          <div class="star-rating flex space-x-1">
            <input type="radio" name="rating" id="rate5"><label for="rate5">★</label>
            <input type="radio" name="rating" id="rate4"><label for="rate4">★</label>
            <input type="radio" name="rating" id="rate3"><label for="rate3">★</label>
            <input type="radio" name="rating" id="rate2"><label for="rate2">★</label>
            <input type="radio" name="rating" id="rate1"><label for="rate1">★</label>
          </div>
        </div>

        <!-- Description -->
        <p class="text-sm text-gray-400 mb-4">
          A delicious black spaghetti with fresh prawns and herbs for a gourmet meal.
        </p>

        <!-- Audio Player -->
        <div class="apple-player rounded-2xl p-4 text-white">
          <audio controls class="w-full">
            <source src="voice1.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
          </audio>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
