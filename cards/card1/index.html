<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>کارت شماره یک</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    .star-rating input {
      display: none;
    }
    .star-rating label {
      font-size: 1.5rem;
      color: #666;
      cursor: pointer;
    }
    .star-rating input:checked ~ label,
    .star-rating label:hover,
    .star-rating label:hover ~ label {
      color: gold;
    }
  </style>
</head>
<body class="bg-gray-900 text-white min-h-screen p-4">
  <!-- Back Button -->
  <div class="mb-4">
    <a href="../../index.html" class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-gray-700 hover:bg-gray-600 text-white text-2xl shadow-md transition">
  ←
</a>

  <!-- Card Container -->
  <div class="bg-gray-800 rounded-3xl shadow-2xl max-w-xl mx-auto overflow-hidden">
    <!-- Main Image -->
    <img src="image1.jpeg" alt="" class="w-full h-[400px] object-cover">

    <!-- Content -->
    <div class="p-6">
      <!-- Title and Rating -->
      <div class="flex justify-between items-center mb-3">
        <h1 class="text-2xl font-bold">عنوان کارت شماره یک</h1>
        <div class="star-rating flex space-x-1">
          <input type="radio" name="rating" id="rate5"><label for="rate5">★</label>
          <input type="radio" name="rating" id="rate4"><label for="rate4">★</label>
          <input type="radio" name="rating" id="rate3"><label for="rate3">★</label>
          <input type="radio" name="rating" id="rate2"><label for="rate2">★</label>
          <input type="radio" name="rating" id="rate1"><label for="rate1">★</label>
        </div>
      </div>

      <!-- Description -->
      <p class="text-sm text-gray-300 mb-6">
        این یک توضیح کوتاه درباره محتوای کارت شماره یک است که در اینجا نوشته می‌شود.
      </p>

      <!-- Audio Player -->
      <audio controls class="w-full">
        <source src="voice1.mp3" type="audio/mpeg">
        مرورگر شما از پخش فایل صوتی پشتیبانی نمی‌کند.
      </audio>
    </div>
  </div>
</body>
</html>
