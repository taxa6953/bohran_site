<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سازمان مدیریت بحران سیستان و بلوچستان</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

<body class="bg-gray-100 text-gray-800">
  <!-- Header -->
  <div class="bg-white rounded-2xl shadow-md m-4 p-4 flex justify-between items-center">

  </div>

  <!-- Cards Grid -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6 px-4">
    <!-- Card 1 -->
    <div onclick="location.href='cards/card1/index.html'" class="bg-white rounded-3xl shadow-xl cursor-pointer overflow-hidden">
      <img src="cards/card1/image1.jpg" alt="کارت ۱" class="w-full h-48 object-cover rounded-t-3xl">
      <div class="p-4">
        <h2 class="text-lg font-bold">کارت شماره ۱</h2>
        <p class="text-sm text-gray-500">توضیح کوتاه درباره کارت اول</p>
      </div>
    </div>

    <!-- Card 2 -->
    <div onclick="location.href='cards/card2/index.html'" class="bg-white rounded-3xl shadow-xl cursor-pointer overflow-hidden">
      <img src="cards/card2/image2.jpg" alt="کارت ۲" class="w-full h-48 object-cover rounded-t-3xl">
      <div class="p-4">
        <h2 class="text-lg font-bold">کارت شماره ۲</h2>
        <p class="text-sm text-gray-500">توضیح کوتاه درباره کارت دوم</p>
      </div>
    </div>

    <!-- Add more cards like this -->
    <!-- Card 3 to Card 10 -->

  </div>

</html>
